# Experiment Configuration
experiment:
  name: "visdrone_benchmark"
  dataset_path: "data/visdrone"
  num_images: 100  # Minimum 100-200 as per requirements
  repetitions: 3  # Run each pipeline multiple times
  
  # Image preprocessing
  image:
    max_dimension: 640
    format: "jpg"
    
  # Pipelines to run
  pipelines:
    - "yolo_local"
    - "yolo_mcp"  # Requires: cd image_detection && python object_detection_server.py
    - "vlm_direct"
    - "vlm_multiagent"
    
  # Pipeline-specific configs
  pipeline_configs:
    yolo_local:
      model: "./models/yolov8m.pt"  # TypeFly YOLOv8m (COCO-trained)
      conf: 0.25
    yolo_mcp:
      enabled: true
      model: "./models/yolov8m.pt"  # MCP server uses same model
      mcp_url: "http://localhost:8099"  # image_detection server
    vlm_direct:
      temperature: 0.1
    vlm_multiagent:
      temperature: 0.1
      max_iterations: 3
    
  # Queries to run
  queries:
    atomic:
      - "How many cars are there?"
      - "How many pedestrians are there?"
      - "How many bicycles are there?"
    composite: true
    
  # Caching
  cache:
    enabled: true
    vision_cache: true
    llm_cache: false  # Optional per requirements
    
  # Resource monitoring
  monitoring:
    enabled: true
    gpu_check: true  # Will check but may not be available on Mac
