# Experiment Configuration
experiment:
  name: "visdrone_benchmark"
  dataset_path: "data/visdrone"
  num_images: 100  # Minimum 100-200 as per requirements
  repetitions: 3  # Run each pipeline multiple times
  
  # Image preprocessing
  image:
    max_dimension: 640
    format: "jpg"
    
  # Pipelines to run
  pipelines:
    - "yolo_local"
    # - "yolo_mcp"  # Disabled - waiting for custom MCP server code
    - "vlm_direct"
    - "vlm_multiagent"
    
  # Pipeline-specific configs
  pipeline_configs:
    yolo_local:
      model: "mshamrai/yolov8n-visdrone"  # VisDrone-trained YOLOv8n
      conf: 0.25
    yolo_mcp:
      enabled: false  # Placeholder - add your custom MCP server details here
      mcp_url: "http://localhost:8080"
      endpoint: "/detect"
    vlm_direct:
      temperature: 0.1
    vlm_multiagent:
      temperature: 0.1
      max_iterations: 3
    
  # Queries to run
  queries:
    atomic:
      - "How many cars are there?"
      - "How many pedestrians are there?"
      - "How many bicycles are there?"
    composite: true
    
  # Caching
  cache:
    enabled: true
    vision_cache: true
    llm_cache: false  # Optional per requirements
    
  # Resource monitoring
  monitoring:
    enabled: true
    gpu_check: true  # Will check but may not be available on Mac
