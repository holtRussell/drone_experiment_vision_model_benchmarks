# Model Configuration
model:
  name: "gemma4:e4b"
  type: "gemma4:e4b"
  temperature: 0.1
  max_tokens: 2048
  system_prompt: "You are a vision analysis assistant. Analyze the provided scene information and answer questions accurately."

# Ollama Endpoint Configuration (OpenAI-compatible)
ollama:
  url: "${OLLAMA_URL:http://localhost:11434/v1}"
  api_key: "${OLLAMA_API_KEY:ollama}"
  timeout: 60

# Gemma4 ModelType reference
model_type: "gemma4:e4b"
